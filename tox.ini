[tox]
envlist =
    py{311,312,313,314}-test{,-devdeps}
    codestyle
isolated_build = true

[testenv]
changedir =
    test: .tmp/{envname}
description =
    test: run tests with pytest
    devdeps: with the development version of Hyperion
extras =
    test
deps =
    devdeps: hyperion @ git+https://github.com/hyperion-rt/hyperion.git
commands =
    pip freeze
    python -m pytest --pyargs mysg {posargs}

[testenv:codestyle]
description = check the code with ruff
skip_install = true
changedir = {toxinidir}
deps = ruff
commands = ruff check .
